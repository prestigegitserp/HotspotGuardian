plugins { id 'com.android.application' }
android {
    namespace 'com.example.hotspotguardian'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.hotspotguardian'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0-safe'
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; debuggable false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
