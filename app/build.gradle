plugins { id 'com.android.application' }
android {
    namespace 'com.example.hotspotguardian'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.hotspotguardian'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.1-fast-recovery'
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; debuggable false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
