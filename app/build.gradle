plugins { id 'com.android.application' }
android {
    namespace 'com.example.hotspotguardian'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.hotspotguardian'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '3.0-one-phone-recovery'
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false; debuggable false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
